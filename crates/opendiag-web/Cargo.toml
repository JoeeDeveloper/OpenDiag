[package]
name = "opendiag-web"
description = "Read-only local web interface for OpenDiag (request handler; the HTTP server lives in the CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
opendiag-data = { path = "../opendiag-data" }
opendiag-services = { path = "../opendiag-services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
opendiag-core = { path = "../opendiag-core" }

[lints]
workspace = true

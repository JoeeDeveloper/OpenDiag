[package]
name = "opendiag-cli"
description = "OpenDiag command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "opendiag"
path = "src/main.rs"

[dependencies]
opendiag-core = { path = "../opendiag-core" }
opendiag-data = { path = "../opendiag-data" }
opendiag-proto = { path = "../opendiag-proto" }
opendiag-services = { path = "../opendiag-services" }
opendiag-transport = { path = "../opendiag-transport" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

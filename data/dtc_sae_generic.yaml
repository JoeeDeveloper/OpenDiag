format: opendiag-data/0
kind: dtcs
provenance:
  author: OpenDiag contributors
  source: public_specification
  license: CC0-1.0
  verified: false
  notes: >-
    Generic powertrain codes defined by the public SAE J2012 / ISO 15031-6
    standards. The code numbers come from the standard; the descriptions are
    written in our own words and are deliberately short. Written from general
    knowledge of the standard rather than checked line by line against it, so
    treat every entry as unverified and correct any that are wrong.

name: Bug report
description: Something in OpenDiag does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For results from a real vehicle or bench module, use the hardware test report template instead.
        Remove VINs and other identifying data from logs before posting.
  - type: input
    id: version
    attributes:
      label: OpenDiag version (from `opendiag --version`)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, Windows, macOS]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (simulator commands preferred)
    validations:
      required: true
